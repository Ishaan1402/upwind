name: Narrative Eval

on:
  schedule:
    # Daily 11:00 UTC regression eval of the fixed scenario corpus.
    # 11:00 UTC is off-peak for DeepSeek billing (peak = 01:00-04:00 UTC and
    # 06:00-10:00 UTC; the old 06:00 UTC run fell inside peak).
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      judge_model:
        description: 'Candidate judge model to compare against the default'
        required: false
        default: 'llama-3.1-8b-instant'
      min_pass:
        description: 'Minimum scenarios that must pass (0-7) before the job fails'
        required: false
        default: '4'

concurrency:
  group: narrative-eval
  cancel-in-progress: false

jobs:
  corpus-eval:
    name: Corpus + judge-compare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check API keys
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "::error::DEEPSEEK_API_KEY secret is not set in GitHub"; exit 1; }
          test -n "$GROQ_API_KEY" || { echo "::error::GROQ_API_KEY secret is not set in GitHub"; exit 1; }

      - name: Run corpus eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m backend.eval corpus --out corpus.json

      - name: Judge compare
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m backend.eval judge-compare --model "${{ inputs.judge_model || 'llama-3.1-8b-instant' }}" --out compare.json

      # Upload before the threshold gate: a failed eval must still keep its
      # evidence and reach the dashboard instead of disappearing.
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            corpus.json
            compare.json

      - name: Check pass-rate threshold and summarize
        env:
          MIN_PASS: ${{ inputs.min_pass || '4' }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.load(open("corpus.json"))
          passed = sum(1 for r in results if r["verdict"].get("verdict") == "pass")
          min_pass = int(os.environ["MIN_PASS"])
          rows = "".join(
              f"| {r['scenario']} | {r['verdict'].get('verdict')} | "
              f"{r['verdict'].get('judge_model')} | "
              f"{(r['verdict'].get('reasoning') or '')[:80].replace(chr(10), ' ')} |\n"
              for r in results
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Narrative eval: {passed}/{len(results)} passed\n\n")
              f.write("| scenario | verdict | judge model | reasoning |\n|---|---|---|---|\n")
              f.write(rows)
          print(f"passed={passed}/{len(results)} (minimum {min_pass})")
          if passed < min_pass:
              print("::error::Narrative pass rate below threshold")
              raise SystemExit(1)
          PY

  publish-dashboard:
    name: Publish dashboard to VM
    needs: corpus-eval
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST" || { echo "::error::SSH_HOST secret is not set in GitHub"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::SSH_USER secret is not set in GitHub"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY secret is not set in GitHub"; exit 1; }

      - name: Download eval results
        uses: actions/download-artifact@v4
        with:
          name: eval-results
          path: eval-results
        continue-on-error: true
        if: always()

      - name: Publish dashboard (3 attempts, health-checked)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/upwind_eval_key"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          SSH_OPTS="-i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"

          # Only ship files that actually exist (corpus/compare may be absent
          # when the eval job failed before producing them).
          FILES=""
          [ -f eval-results/corpus.json ] && FILES="$FILES eval-results/corpus.json"
          [ -f eval-results/compare.json ] && FILES="$FILES eval-results/compare.json"

          # Runs on the VM so production stats from cache.db are embedded fresh.
          REMOTE='set -e
          mkdir -p ~/eval-www
          cd ~/upwind
          git pull origin main --ff-only
          ./venv/bin/python -m backend.eval stats --out /tmp/eval_stats.json
          ./venv/bin/python -m backend.eval rule-judge --out /tmp/eval_rule_hits.json
          ARGS=""
          [ -f /tmp/corpus.json ] && ARGS="$ARGS --corpus /tmp/corpus.json"
          [ -f /tmp/compare.json ] && ARGS="$ARGS --compare /tmp/compare.json"
          ./venv/bin/python -m backend.eval render-dashboard $ARGS --stats /tmp/eval_stats.json --rule-hits /tmp/eval_rule_hits.json --out ~/eval-www/index.html
          [ -f ~/.eval_auth ] || { echo "first deploy: run scripts/setup_eval_dashboard.sh on the VM" >&2; exit 1; }
          CODE="$(curl -s -o /dev/null -w "%{http_code}" -k -u "$(cat ~/.eval_auth)" -H "Host: getupwind.me" http://127.0.0.1/eval/)"
          if [ "$CODE" != "200" ]; then
            CODE="$(curl -s -o /dev/null -w "%{http_code}" -k -u "$(cat ~/.eval_auth)" -H "Host: getupwind.me" https://127.0.0.1/eval/)"
          fi
          if [ "$CODE" = "200" ]; then
            echo "dashboard published (health check HTTP 200)"
          else
            echo "health check failed (HTTP $CODE); if this is the first deploy, run scripts/setup_eval_dashboard.sh on the VM" >&2
            exit 1
          fi'

          for attempt in 1 2 3; do
            if [ -n "$FILES" ]; then
              if ! scp $SSH_OPTS $FILES "$SSH_USER@$SSH_HOST:/tmp/"; then
                echo "scp failed on attempt $attempt/3; retrying in 20s..."
                sleep 20
                continue
              fi
            fi
            if ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "$REMOTE"; then
              echo "SSH publish succeeded on attempt $attempt"
              exit 0
            fi
            echo "SSH publish failed on attempt $attempt/3; retrying in 20s..."
            sleep 20
          done
          exit 1
