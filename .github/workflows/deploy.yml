name: Deploy Upwind to Oracle VM

on:
  push:
    branches:
      - main  # Triggers deployment whenever you push to main

jobs:
  tests:
    name: "Gate: tests & build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run backend tests
        run: python -m pytest tests/ -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Exit immediately if a command fails
            
            echo "--> Navigating to project directory..."
            cd ~/upwind
            
            echo "--> Pulling latest code..."
            git pull origin main
            
            echo "--> Updating Python virtual environment..."
            ./venv/bin/pip install --upgrade pip
            if [ -f backend/requirements.txt ]; then
              ./venv/bin/pip install -r backend/requirements.txt
            fi
            
            cd frontend
            npm ci
            npm run build
            cd ..
            
            echo "--> Restarting Upwind application..."
            sudo systemctl restart upwind
            
            echo "--> Verifying deployment..."
            sleep 2
            sudo systemctl is-active upwind
